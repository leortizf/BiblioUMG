# Configuración de SonarCloud (E12). Cambie organization y projectKey por los que muestra SonarCloud.
sonar.organization=leortizf
sonar.projectKey=leortizf_BiblioUMG
sonar.projectName=BiblioUMG

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# main.js solo dibuja pantallas (DOM); se verifica con las pruebas manuales de la fase 1.
# Las pruebas unitarias se concentran en la lógica: reglas, seguridad, préstamos, validaciones y api.
sonar.coverage.exclusions=frontend/src/main.js

# El pipeline espera el resultado del quality gate y falla si no se aprueba.
sonar.qualitygate.wait=true
